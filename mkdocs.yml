site_name: Hybrid Sample Generator
site_url: https://pfleiderer-adrian.github.io/HybridSampleGeneration/
repo_url: https://github.com/Pfleiderer-Adrian/HybridSampleGeneration
repo_name: Pfleiderer-Adrian/HybridSampleGeneration
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
extra:
  # Hide the "Made with Material for MkDocs" notice in the footer.
  generator: false
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - def_list
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
validation:
  links:
    anchors: warn
plugins:
  - search:
      lang: en
nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quick-start.md
  - Guides:
      - Input data: guides/input-data.md
      - Pipeline overview: guides/pipeline.md
      - Extraction: guides/extraction.md
      - Generator training: guides/training.md
      - Synthetic variants: guides/generation.md
      - Hybrid planning: guides/matching.md
      - Fusion: guides/fusion.md
      - Postprocessing: guides/postprocessing.md
      - Evaluation: guides/evaluation.md
      - Visualization: guides/visualization.md
      - Continuing a study: guides/continuing-studies.md
  - Concepts:
      - Data model and storage: concepts/study-storage.md
      - Repository datasets: concepts/datasets.md
      - Glossary: concepts/glossary.md
  - Configuration:
      - Overview: configuration/index.md
      - Study: configuration/reference/study.md
      - Extraction: configuration/reference/extraction.md
      - Augmentation: configuration/reference/augmentation.md
      - Generation: configuration/reference/generation.md
      - Matching: configuration/reference/matching.md
      - Postprocessing: configuration/reference/postprocessing.md
      - Training: configuration/reference/training.md
      - Evaluation: configuration/reference/evaluation.md
      - Models:
          - Overview: configuration/models.md
          - VAE ResNet 2D: configuration/reference/model-VAE_ResNet_2D.md
          - VAE ResNet 3D: configuration/reference/model-VAE_ResNet_3D.md
          - VAE ConvNeXt 2D: configuration/reference/model-VAE_ConvNeXt_2D.md
          - VAE ConvNeXt 3D: configuration/reference/model-VAE_ConvNeXt_3D.md
          - cVAE ConvNeXt 2D: configuration/reference/model-cVAE_ConvNeXt_2D.md
          - cVAE ConvNeXt 3D: configuration/reference/model-cVAE_ConvNeXt_3D.md
          - Paired cVAE ConvNeXt 2D: configuration/reference/model-paired_cVAE_ConvNeXt_2D.md
          - Paired cVAE ConvNeXt 3D: configuration/reference/model-paired_cVAE_ConvNeXt_3D.md
      - Fusion:
          - Overview: configuration/fusion.md
          - Classical: configuration/reference/fusion-classical.md
          - Poisson: configuration/reference/fusion-poisson.md
  - MVTec AD 2 benchmark:
      - Overview: mvtec-ad2/index.md
      - Downstream training: mvtec-ad2/downstream-training.md
      - Downstream models:
          - Paired DINOv3: mvtec-ad2/dinov3-paired.md
          - DINOv3 segmentation decoder: mvtec-ad2/dinov3-segmentation.md
          - SuperADD-inspired dual banks: mvtec-ad2/superadd-dual-bank.md
      - Downstream evaluation: mvtec-ad2/downstream-evaluation.md
  - Development:
      - Contributing: development/contributing.md
      - Tests: development/testing.md
      - Documentation: development/documentation.md
      - Project structure: development/project-structure.md
      - Releases: development/releases.md
  - LLM usage statement: llm-usage.md
  - Citation and license: about.md
