name: Documentation

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MkDocs
        run: python -m pip install "mkdocs-material>=9.7,<10"
      - name: Build site
        run: mkdocs build --strict
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  links:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check links in Markdown files
        uses: lycheeverse/lychee-action@v2
        with:
          # Relative links are verified by "mkdocs build --strict"; this job
          # covers external URLs and GitHub blob links. gnu.org is excluded
          # because it regularly times out for requests from CI runners.
          args: >-
            --no-progress
            --max-retries 3
            --timeout 30
            --accept 200..=299,403,429
            --exclude '^https://pfleiderer-adrian\.github\.io/HybridSampleGeneration/'
            --exclude '^http://127\.0\.0\.1'
            --exclude '^https://www\.gnu\.org/'
            "docs/**/*.md" README.md
          fail: true

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
