name: Publish Python Package

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build wheel and source distribution
        run: python -m build
      
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import zipfile
          from pathlib import Path
          
          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          
          wheels = list(Path("dist").glob("*.whl"))
          if not wheels:
              raise SystemExit("No wheel was built.")
              
          for wheel in wheels:
              with zipfile.ZipFile(wheel) as archive:
                  metadata_name = next(
                      name for name in archive.namelist()
                      if name.endswith(".dist-info/METADATA")
                  )
                  metadata = archive.read(metadata_name).decode()
                  
              actual = next(
                  line.removeprefix("Version: ")
                  for line in metadata.splitlines()
                  if line.startswith("Version: ")
              )
              
              if actual != expected:
                  raise SystemExit(
                      f"Release tag {expected!r} does not match "
                      f"package version {actual!r}."
                  )
                  
          print(f"Release version {expected} verified.")
          PY

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/hybrid-sample-generator

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
