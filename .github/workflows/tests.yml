name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
          python -m pip install unittest-xml-reporting

      - name: Run project tests
        run: python -m xmlrunner discover -s tests -v -o test-results
      
      - name: Publish individual test checks
        if: >-
          ${{
            !cancelled() &&
            (
              github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository
            )
          }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TEST_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python .github/scripts/publish_test_checks.py
